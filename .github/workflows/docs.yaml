name: Docs

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.11.2
        with:
          # Pinned so CI is reproducible; bump together with the setup-pixi action.
          pixi-version: v0.83.0
          environments: dev
          cache: false
          post-cleanup: false

      - name: Generate docs with mojodoc
        run: pixi run -e dev docs-build
